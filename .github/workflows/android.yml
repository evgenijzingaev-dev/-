name: Proposal dialog emulator QA
on:
  push:
    branches: [qa/proposal-dialog-fd62495]
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Start clean Android emulator with KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-34;default;x86_64'
          "$tools/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' emulator "$image"
          echo no | "$tools/avdmanager" create avd -n proposal -k "$image" --force
          "$ANDROID_HOME/emulator/emulator" -avd proposal -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 360 bash -c 'adb wait-for-device; until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done' || { tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb shell wm size 720x1280
          adb shell wm density 320
          adb shell input keyevent 82
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$setting" 0; done
      - name: Run and verify one instrumentation case
        run: |
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.smartbasket.app.ProposalDialogTest
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          cases = [case for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True) for case in ET.parse(path).iter("testcase")]
          assert len(cases) == 1, f"Expected one result, found {len(cases)}"
          case = cases[0]
          assert case.get("classname") == "ru.smartbasket.app.ProposalDialogTest"
          assert case.get("name") == "scrollToLastNutritionLineThenDeclineAndApply"
          assert all(case.find(tag) is None for tag in ("skipped", "error", "failure"))
          print("PASS:", case.attrib)
          PY
